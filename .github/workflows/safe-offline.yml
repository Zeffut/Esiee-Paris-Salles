name: Safe offline tests and image build
on:
  push:
    branches: ['forge/**']
  pull_request:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safe-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    if: github.event_name != 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/forge/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTHOG_API_KEY: ''
      POSTHOG_HOST: https://posthog.invalid
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install public dependencies (no application execution)
        run: python -m pip install -r api/requirements.txt
      - name: Synthetic tests with socket/DNS deny guard
        run: python tools/run_offline_tests.py
      - name: Build API locally, never push
        run: docker build --label org.opencontainers.image.revision=${{ github.sha }} -t esiee-api-ci:${{ github.sha }} api
      - name: Test built API offline, without starting app.py
        run: >-
          docker run --rm --network none --cpus=1 --memory=512m
          -e PYTHONDONTWRITEBYTECODE=1 -e ESIEE_TEST_API_DIR=/app
          -e POSTHOG_API_KEY= -e POSTHOG_HOST=https://posthog.invalid
          -v "$PWD:/candidate:ro" --entrypoint python
          esiee-api-ci:${{ github.sha }} /candidate/tools/run_offline_tests.py
      - name: Build unchanged frontend locally, never run or push
        run: docker build -t esiee-frontend-ci:${{ github.sha }} frontend
