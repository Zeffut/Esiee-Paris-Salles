# Cache navigateur : sans en-tête, les navigateurs gardaient l'ancienne version
# plusieurs jours (cache heuristique basé sur Last-Modified). Les pages et fichiers
# du site sont donc revérifiés à chaque visite (réponse 304 légère si rien n'a
# changé). Les proxys /rb et /ingest gardent les en-têtes de leurs serveurs.
map $request_uri $esiee_cache_control {
    ~^/(rb|ingest)/      "";
    # Fichiers versionnés (?v=…) et polices : leur adresse change à chaque version,
    # ils peuvent donc être gardés un an sans risque de servir une ancienne version.
    "~[?&]v=[0-9a-z]"    "public, max-age=31536000, immutable";
    "~^/fonts/"          "public, max-age=31536000, immutable";
    default              "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Redirections relatives : derrière le nginx du VPS (HTTPS), une redirection
    # absolue renvoyait vers http://
    absolute_redirect off;

    # Compression des fichiers texte (HTML, CSS, JS, JSON)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    add_header Cache-Control $esiee_cache_control always;

    # Security headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; connect-src 'self' https://api.zeffut.fr https://accounts.google.com https://www.googleapis.com; worker-src 'self' blob:; frame-src https://accounts.google.com; img-src 'self' data: blob: https://lh3.googleusercontent.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Redirects: .html → clean URLs
    location = /index.html        { return 301 /; }
    location = /reservations.html { return 301 /reservations; }
    location = /confidentialite.html { return 301 /confidentialite; }
    location = /profile.html      { return 301 /profile; }
    # L'ancienne page Réglages (choix du thème) n'existe plus : le thème est clair pour l'instant
    location = /settings.html     { return 301 /profile; }
    location = /settings          { return 301 /profile; }

    # Pages
    location = / {
        try_files /index.html =404;
    }
    location = /profile {
        try_files /profile.html =404;
    }
    location = /reservations {
        try_files /reservations.html =404;
    }
    location = /confidentialite {
        try_files /confidentialite.html =404;
    }

    # Static assets
    location ~* \.(js|css|ico|png|jpg|svg|woff2?|txt)$ {
        try_files $uri =404;
    }

    # TEMPORAIRE (refonte du 3 nov. 2026, à retirer vers le 20 nov.) : des navigateurs
    # ont gardé l'ancienne page en cache sans jamais la redemander. Cette page charge
    # /rb/script.js à chaque visite (max-age=0, requête envoyée avec les cookies, donc
    # Clear-Site-Data est appliqué) : on vide le cache du site, et la visite suivante
    # charge la nouvelle version. Les autres requêtes de suivi partent sans cookies :
    # le navigateur y ignorerait cet en-tête (et l'afficherait en erreur).
    location = /rb/script.js {
        add_header Clear-Site-Data "\"cache\"" always;
        proxy_pass https://tracking.zeffut.fr/api/script.js;
        proxy_ssl_server_name on;
        proxy_set_header Host tracking.zeffut.fr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rybbit tracking proxy (^~ pour priorité sur le regex .js)
    location ^~ /rb/ {
        proxy_pass https://tracking.zeffut.fr/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host tracking.zeffut.fr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PostHog reverse proxy — assets statiques (recorder, array.js…) via eu-assets
    location ^~ /ingest/static/ {
        proxy_pass https://eu-assets.i.posthog.com/static/;
        proxy_ssl_server_name on;
        proxy_set_header Host eu-assets.i.posthog.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PostHog reverse proxy — ingestion des events / replay / flags via eu
    location ^~ /ingest/ {
        proxy_pass https://eu.i.posthog.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host eu.i.posthog.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
