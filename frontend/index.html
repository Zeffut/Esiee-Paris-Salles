<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Salles libres — ESIEE</title>

<meta name="description" content="Les salles libres de l'ESIEE Paris en ce moment, et jusqu'à quand.">
<meta name="theme-color" content="#F2F5F9">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="app.css?v=20261103e" />
<!-- Google Identity Services (connexion, uniquement utilisée pour réserver et les favoris) -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="core.js?v=20261103e"></script>
<script src="salles.js?v=20261103e" defer></script>
</head>
<body data-page="salles">
<div class="page">

  <!-- ============================== Accueil ============================== -->
  <section class="view" id="viewHome" aria-labelledby="homeTitle">
    <header class="page-head">
      <p class="page-date" id="nowLabel">&nbsp;</p>
      <h1 class="page-title" id="homeTitle">Salles libres</h1>
    </header>

    <div class="home-tools">
      <button type="button" class="search-field" id="openSearch">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#55627A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.5-4.5"/></svg>
        Chercher une salle, un épi…
      </button>
      <div class="chips" id="chipRow" role="group" aria-label="Filtres">
        <span class="skel skel-chip" style="width:86px"></span>
        <span class="skel skel-chip" style="width:72px"></span>
        <span class="skel skel-chip" style="width:56px"></span>
        <span class="skel skel-chip" style="width:64px"></span>
      </div>
    </div>

    <div id="homeContent">
      <!-- État de chargement (remplacé dès réception des données) -->
      <div aria-busy="true">
        <div class="skel-hero skel"></div>
        <p class="loading-label" role="status">Lecture des emplois du temps…</p>
        <div class="stack">
          <div class="skel-card"><div class="skel-row"><span class="skel" style="width:110px;height:16px"></span><span class="skel" style="width:80px;height:16px"></span></div><span class="skel skel--soft" style="width:170px;height:12px"></span><span class="skel skel--soft" style="height:6px;border-radius:3px"></span></div>
          <div class="skel-card"><div class="skel-row"><span class="skel" style="width:110px;height:16px"></span><span class="skel" style="width:80px;height:16px"></span></div><span class="skel skel--soft" style="width:170px;height:12px"></span><span class="skel skel--soft" style="height:6px;border-radius:3px"></span></div>
          <div class="skel-card"><div class="skel-row"><span class="skel" style="width:110px;height:16px"></span><span class="skel" style="width:80px;height:16px"></span></div><span class="skel skel--soft" style="width:170px;height:12px"></span><span class="skel skel--soft" style="height:6px;border-radius:3px"></span></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============================== Recherche ============================== -->
  <section class="view" id="viewSearch" hidden aria-label="Recherche">
    <div class="search-bar">
      <label class="search-input">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#55627A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.5-4.5"/></svg>
        <span class="sr-only">Rechercher une salle</span>
        <input type="search" id="searchInput" placeholder="Numéro, épi, amphi…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <button type="button" class="icon-clear" id="searchClear" aria-label="Effacer" hidden>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </label>
      <button type="button" class="text-btn" id="searchCancel">Annuler</button>
    </div>
    <p class="search-summary" id="searchSummary" aria-live="polite" hidden></p>
    <ul class="stack" id="searchResults"></ul>
    <section class="section" id="recentSection" hidden>
      <h2 class="section-label">Recherches récentes</h2>
      <div class="chips chips--wrap" id="recentChips"></div>
    </section>
  </section>

  <!-- ============================== Fiche salle ============================== -->
  <section class="view" id="viewRoom" hidden aria-labelledby="roomTitle"></section>

  <!-- ============================== Réservation confirmée ============================== -->
  <section class="view" id="viewConfirm" hidden aria-labelledby="confirmTitle"></section>

</div>

<!-- ============================== Filtres ============================== -->
<dialog class="sheet sheet--tall" id="filterSheet" aria-labelledby="filterTitle">
  <span class="sheet-handle" aria-hidden="true"></span>
  <div class="sheet-head">
    <h2 id="filterTitle">Filtres</h2>
    <button type="button" class="round-btn round-btn--plain" id="filterClose" aria-label="Fermer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="filterGroups"></div>
  <div class="sheet-foot">
    <button type="button" class="btn-reset" id="filterReset">Réinitialiser</button>
    <button type="button" class="btn btn-primary btn-apply" id="filterApply">Voir les salles</button>
  </div>
</dialog>

<!-- ============================== Réserver ============================== -->
<dialog class="sheet" id="reserveSheet" aria-labelledby="reserveTitle">
  <form id="reserveForm" style="display:flex;flex-direction:column;gap:18px;padding:0 var(--gutter) calc(30px + env(safe-area-inset-bottom, 0px));overflow-y:auto">
    <span class="sheet-handle" aria-hidden="true"></span>
    <div class="sheet-head sheet-head--top" style="padding:0">
      <div>
        <h2 id="reserveTitle">Réserver la salle</h2>
        <p class="sheet-sub" id="reserveSub"></p>
      </div>
      <button type="button" class="round-btn round-btn--plain" id="reserveClose" aria-label="Fermer" style="margin:-6px -10px 0 0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <fieldset class="filter-group">
      <legend>Choisis un créneau d'une heure</legend>
      <div id="reserveSlots" style="display:flex;flex-direction:column;gap:10px"></div>
    </fieldset>
    <p class="note">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      On peut réserver jusqu'à 2 heures à l'avance.
    </p>
    <p class="form-error" id="reserveError" role="alert" hidden></p>
    <button type="submit" class="btn btn-primary" id="reserveSubmit">Confirmer</button>
  </form>
</dialog>

<!-- ============================== Connexion ============================== -->
<dialog class="sheet" id="loginSheet" aria-labelledby="loginTitle">
  <span class="sheet-handle" aria-hidden="true"></span>
  <div class="sheet-head sheet-head--top">
    <h2 id="loginTitle">Connecte-toi pour réserver</h2>
    <button type="button" class="round-btn round-btn--plain" id="loginClose" aria-label="Fermer" style="margin:-6px -10px 0 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body" style="gap:14px;padding-bottom:calc(30px + env(safe-area-inset-bottom, 0px))">
    <p class="card-text" id="loginText" style="margin:0"></p>
    <button type="button" class="btn btn-outline btn-google" id="loginGoogle">Continuer avec Google</button>
    <span class="card-hint">Avec ton adresse ESIEE</span>
  </div>
</dialog>

<!-- ============================== Onglets ============================== -->
<nav class="tabbar" aria-label="Navigation principale">
  <div class="tabbar-inner">
    <a class="tab" href="/" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17M3 21h18M14 12h.01"/></svg>Salles</a>
    <a class="tab" href="/reservations">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Réservations</a>
    <a class="tab" href="/profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profil</a>
  </div>
</nav>

<!-- Rybbit Analytics (proxifié pour contourner les adblockers) -->
<script src="/rb/script.js" data-site-id="a969e55cd4ad" defer></script>
<!-- PostHog Analytics (proxifié via /ingest) — externalisé pour respecter la CSP -->
<script src="/posthog.js" defer></script>
</body>
</html>
